<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>CSIS 3764 — Course Notebooks</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500;600&display=swap"
            rel="stylesheet"
        />

        <style>
            *,
            *::before,
            *::after {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }

            :root {
                --bg: #0d1117;
                --surface: #161b22;
                --surface2: #1c2330;
                --border: #30363d;
                --accent: #f0a500;
                --accent2: #e05c2e;
                --text: #e6edf3;
                --muted: #8b949e;
                --tag-bg: #1f2d3d;
                --tag-text: #79c0ff;
                --radius: 10px;
            }

            html {
                scroll-behavior: smooth;
            }

            body {
                background: var(--bg);
                color: var(--text);
                font-family: "DM Sans", sans-serif;
                font-size: 15px;
                line-height: 1.6;
                min-height: 100vh;
            }

            /* ── HEADER ── */
            header {
                background: var(--surface);
                border-bottom: 1px solid var(--border);
                padding: 0 2rem;
                position: sticky;
                top: 0;
                z-index: 100;
                display: flex;
                align-items: center;
                gap: 1.5rem;
                height: 58px;
            }

            .logo {
                font-family: "DM Serif Display", serif;
                font-size: 1.15rem;
                color: var(--accent);
                white-space: nowrap;
                letter-spacing: 0.01em;
            }

            .logo span {
                color: var(--muted);
                font-family: "DM Sans", sans-serif;
                font-size: 0.8rem;
                font-weight: 400;
                margin-left: 8px;
            }

            .search-wrap {
                flex: 1;
                max-width: 560px;
                position: relative;
            }

            .search-wrap svg {
                position: absolute;
                left: 12px;
                top: 50%;
                transform: translateY(-50%);
                color: var(--muted);
                pointer-events: none;
            }

            #search {
                width: 100%;
                background: var(--bg);
                border: 1px solid var(--border);
                border-radius: 8px;
                color: var(--text);
                font-family: "DM Sans", sans-serif;
                font-size: 0.9rem;
                padding: 0.45rem 1rem 0.45rem 2.4rem;
                outline: none;
                transition: border-color 0.2s;
            }

            #search::placeholder {
                color: var(--muted);
            }
            #search:focus {
                border-color: var(--accent);
            }

            .match-count {
                font-size: 0.78rem;
                color: var(--muted);
                white-space: nowrap;
            }

            /* ── HERO ── */
            .hero {
                padding: 3.5rem 2rem 2.5rem;
                max-width: 1100px;
                margin: 0 auto;
            }

            .hero h1 {
                font-family: "DM Serif Display", serif;
                font-size: clamp(2rem, 4vw, 3.2rem);
                line-height: 1.15;
                margin-bottom: 0.75rem;
            }

            .hero h1 em {
                font-style: italic;
                background: linear-gradient(
                    120deg,
                    var(--accent),
                    var(--accent2)
                );
                -webkit-background-clip: text;
                -webkit-text-fill-color: transparent;
                background-clip: text;
            }

            .hero p {
                color: var(--muted);
                max-width: 520px;
                font-size: 0.95rem;
            }

            /* ── FILTER PILLS ── */
            .filters {
                padding: 0 2rem 1.5rem;
                max-width: 1100px;
                margin: 0 auto;
                display: flex;
                flex-wrap: wrap;
                gap: 0.5rem;
            }

            .pill {
                background: var(--surface);
                border: 1px solid var(--border);
                border-radius: 999px;
                color: var(--muted);
                cursor: pointer;
                font-size: 0.8rem;
                font-weight: 500;
                padding: 0.3rem 0.85rem;
                transition:
                    background 0.15s,
                    border-color 0.15s,
                    color 0.15s;
                user-select: none;
            }

            .pill:hover {
                border-color: var(--accent);
                color: var(--accent);
            }
            .pill.active {
                background: var(--accent);
                border-color: var(--accent);
                color: #000;
            }

            /* ── GRID ── */
            .grid {
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
                gap: 1.25rem;
                padding: 0 2rem 4rem;
                max-width: 1100px;
                margin: 0 auto;
            }

            /* ── CARD ── */
            .card {
                background: var(--surface);
                border: 1px solid var(--border);
                border-radius: var(--radius);
                display: flex;
                flex-direction: column;
                overflow: hidden;
                transition:
                    border-color 0.2s,
                    transform 0.2s;
                animation: fadeUp 0.4s ease both;
            }

            .card:hover {
                border-color: var(--accent);
                transform: translateY(-3px);
            }

            .card[data-hidden="true"] {
                display: none;
            }

            @keyframes fadeUp {
                from {
                    opacity: 0;
                    transform: translateY(14px);
                }
                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }

            .card-accent-bar {
                height: 3px;
                width: 100%;
            }

            .card-body {
                padding: 1.25rem 1.25rem 1rem;
                flex: 1;
            }

            .card-label {
                font-family: "DM Mono", monospace;
                font-size: 0.72rem;
                color: var(--muted);
                text-transform: uppercase;
                letter-spacing: 0.08em;
                margin-bottom: 0.4rem;
            }

            .card-title {
                font-family: "DM Serif Display", serif;
                font-size: 1.18rem;
                line-height: 1.25;
                margin-bottom: 0.65rem;
            }

            .card-desc {
                color: var(--muted);
                font-size: 0.84rem;
                line-height: 1.55;
                margin-bottom: 1rem;
            }

            /* sections list */
            .sections {
                list-style: none;
                border-top: 1px solid var(--border);
                padding-top: 0.75rem;
            }

            .sections li {
                font-size: 0.8rem;
                color: var(--muted);
                padding: 0.2rem 0;
                display: flex;
                align-items: baseline;
                gap: 0.4rem;
            }

            .sections li::before {
                content: "§";
                font-family: "DM Mono", monospace;
                font-size: 0.7rem;
                color: var(--border);
                flex-shrink: 0;
            }

            .sections li.search-match {
                color: var(--text);
            }

            .sections li.search-match::before {
                color: var(--accent);
            }

            mark {
                background: rgba(240, 165, 0, 0.3);
                color: var(--accent);
                border-radius: 2px;
                padding: 0 2px;
            }

            /* tags */
            .tags {
                display: flex;
                flex-wrap: wrap;
                gap: 0.4rem;
                margin-bottom: 0.9rem;
            }

            .tag {
                background: var(--tag-bg);
                color: var(--tag-text);
                border-radius: 4px;
                font-size: 0.72rem;
                font-family: "DM Mono", monospace;
                padding: 0.15rem 0.5rem;
            }

            /* card footer */
            .card-footer {
                padding: 0.85rem 1.25rem;
                border-top: 1px solid var(--border);
                display: flex;
                align-items: center;
                justify-content: space-between;
            }

            .open-btn {
                background: transparent;
                border: 1px solid var(--border);
                border-radius: 6px;
                color: var(--text);
                cursor: pointer;
                font-family: "DM Sans", sans-serif;
                font-size: 0.82rem;
                font-weight: 500;
                padding: 0.4rem 0.9rem;
                text-decoration: none;
                transition:
                    background 0.15s,
                    border-color 0.15s,
                    color 0.15s;
                display: inline-flex;
                align-items: center;
                gap: 0.35rem;
            }

            .open-btn:hover {
                background: var(--accent);
                border-color: var(--accent);
                color: #000;
            }

            .open-btn svg {
                flex-shrink: 0;
            }

            .section-count {
                font-size: 0.75rem;
                color: var(--muted);
                font-family: "DM Mono", monospace;
            }

            /* ── NO RESULTS ── */
            #no-results {
                display: none;
                grid-column: 1 / -1;
                text-align: center;
                padding: 4rem 1rem;
                color: var(--muted);
            }

            #no-results h3 {
                font-family: "DM Serif Display", serif;
                font-size: 1.4rem;
                margin-bottom: 0.5rem;
                color: var(--text);
            }

            /* ── FOOTER ── */
            footer {
                border-top: 1px solid var(--border);
                padding: 1.5rem 2rem;
                text-align: center;
                font-size: 0.78rem;
                color: var(--muted);
            }

            /* ── RESPONSIVE ── */
            @media (max-width: 600px) {
                header {
                    padding: 0 1rem;
                    gap: 0.75rem;
                }
                .logo span {
                    display: none;
                }
                .hero,
                .filters,
                .grid {
                    padding-left: 1rem;
                    padding-right: 1rem;
                }
                .grid {
                    grid-template-columns: 1fr;
                }
            }
        </style>
    </head>
    <body>
        <!-- ─── HEADER ─── -->
        <header>
            <div class="logo">
                CSIS 3764
                <span>Data Science Notebooks</span>
            </div>
            <div class="search-wrap">
                <svg
                    width="16"
                    height="16"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    viewBox="0 0 24 24"
                >
                    <circle cx="11" cy="11" r="8" />
                    <path d="m21 21-4.35-4.35" />
                </svg>
                <input
                    type="search"
                    id="search"
                    placeholder="Search topics, keywords, sections…"
                    autocomplete="off"
                    spellcheck="false"
                />
            </div>
            <div class="match-count" id="match-count"></div>
        </header>

        <!-- ─── HERO ─── -->
        <div class="hero">
            <h1>Course <em>Notebooks</em></h1>
            <p>
                Browse all Jupyter notebooks from CSIS 3764. Use the search bar
                or topic filters to find content quickly.
            </p>
        </div>

        <!-- ─── FILTER PILLS ─── -->
        <div class="filters" id="filters">
            <button class="pill active" data-tag="all">All notebooks</button>
            <button class="pill" data-tag="pandas">Pandas</button>
            <button class="pill" data-tag="statistics">Statistics</button>
            <button class="pill" data-tag="preprocessing">Preprocessing</button>
            <button class="pill" data-tag="machine-learning">
                Machine Learning
            </button>
            <button class="pill" data-tag="regression">Regression</button>
            <button class="pill" data-tag="visualization">Visualization</button>
            <button class="pill" data-tag="clustering">Clustering</button>
        </div>

        <!-- ─── CARDS GRID ─── -->
        <div class="grid" id="grid">
            <!-- Card 1 -->
            <div
                class="card"
                data-tags="pandas visualization toolbox numpy matplotlib"
                data-title="Chapter 2: Toolbox for Data Scientists"
                data-desc="Core libraries for data science — Pandas DataFrames, NumPy, and Matplotlib. Covers reading, selecting, filtering, manipulating, grouping, and plotting data."
                data-sections="DataFrames|Creating a new DataFrame|Open government data example|Reading tabular data|Viewing Data|Selection|Filtering Data|Filtering Missing Values|Manipulating Data|Sorting|Grouping Data|Rearranging Data|Ranking Data|Plotting|Further Reading"
                data-file="ch02_Toolbox-1.html"
            ></div>

            <!-- Card 2 -->
            <div
                class="card"
                data-tags="statistics eda distributions outliers pandas visualization"
                data-title="Chapter 3: Descriptive Statistics"
                data-desc="Computational statistics for data analysis including EDA, histograms, data distributions, outlier detection, relative risk, and the Central Limit Theorem."
                data-sections="Getting Data|Data preparation|Importing data as DataFrame|Data Cleaning|Exploratory Data Analysis|Summarizing the data|Histogram|Data Distributions|Outliers|Measuring asymmetry|Relative Risk|Continuous distributions|Exponential distribution|Normal distribution|Central Limit Theorem|Kernel density estimates"
                data-file="ch03_Descriptive_Statistics-2.html"
            ></div>

            <!-- Card 3 -->
            <div
                class="card"
                data-tags="machine-learning supervised learning learning-curves scikit-learn"
                data-title="Chapter 5: Supervised Learning"
                data-desc="Introduction to supervised machine learning using scikit-learn, including learning curve analysis to diagnose bias and variance."
                data-sections="Supervised learning overview|Learning curves|Bias-variance tradeoff|Model evaluation"
                data-file="ch05_Machine_Learning-5.html"
            ></div>

            <!-- Card 4 -->
            <div
                class="card"
                data-tags="machine-learning preprocessing feature-engineering scikit-learn pandas"
                data-title="Chapter 5: Preprocessing for ML"
                data-desc="End-to-end preprocessing pipeline for machine learning — encoding, scaling, feature selection, and train/test splits using scikit-learn."
                data-sections="Data import|Exploratory analysis|Handling missing values|Encoding categorical data|Feature scaling|Train-test split|Pipeline construction|Model evaluation"
                data-file="ch05_Preprocessing_Machine_Learning-5.html"
            ></div>

            <!-- Card 5 -->
            <div
                class="card"
                data-tags="regression linear-regression logistic-regression scikit-learn statsmodels"
                data-title="Chapter 6: Regression Analysis"
                data-desc="Simple & multiple linear regression, polynomial regression, sparse models, and logistic regression. Practical cases include climate change, housing data, and football outcomes."
                data-sections="Simple and Multiple Linear Regression|Ordinary Least Squares|Practical case: Climate Change & Sea Ice|Polynomial Regression|Practical case: Housing Data|Visualizations|Heatmap|Scatter plot|Predictions|Sparse models|Transformer|Statistical evaluation|Logistic Regression|Practical case: Winning Football Team"
                data-file="ch06_Regression_Analysis-6.html"
            ></div>

            <!-- Card 6 -->
            <div
                class="card"
                data-tags="preprocessing missing-values encoding correlation classification machine-learning"
                data-title="Lab: Preprocessing I (2022)"
                data-desc="Hands-on preprocessing lab covering missing value handling, object-to-numeric conversion, text vectorisation, correlation analysis, outlier removal, and classifier comparison."
                data-sections="Libraries|Import the dataset|Summarize the data|Handle missing values|Clean the data|Convert objects to numeric values|Convert text to vector space|Drop irrelevant columns|Correlation|Remove outliers|Define X and y|Train classifiers|Compare classifiers|Predict|Interpret the scores|Dummy classifier"
                data-file="CSIS3764_Preprocess1_2022-3.html"
            ></div>

            <!-- Card 7 -->
            <div
                class="card"
                data-tags="clustering k-means visualization preprocessing pandas"
                data-title="Lab: Preprocessing II — Clustering (2022)"
                data-desc="Data cleaning, exploration, and k-Means clustering on the Iris dataset. Includes box plots, visualisation with cluster labels, and prediction for new data points."
                data-sections="Libraries|Import the dataset|Summarize the data|Box plots|Clean the data|Updated shape and box plots|Visualize the data|k-Means clustering|Print labels|Re-create plots with clusters|New flower|Re-create plots with new features"
                data-file="CSIS3764_Preporcess2_2022-4.html"
            ></div>

            <div id="no-results">
                <h3>No notebooks found</h3>
                <p>Try a different keyword or clear the search.</p>
            </div>
        </div>

        <footer>
            CSIS 3764 · Data Science · Jupyter Notebooks · GitHub Pages
        </footer>

        <script>
            // ── colour palette for accent bars ──
            const COLORS = [
                "linear-gradient(90deg,#f0a500,#e05c2e)",
                "linear-gradient(90deg,#3fb950,#1a7f37)",
                "linear-gradient(90deg,#58a6ff,#1f6feb)",
                "linear-gradient(90deg,#bc8cff,#8957e5)",
                "linear-gradient(90deg,#ff7b72,#cf222e)",
                "linear-gradient(90deg,#39d353,#006d32)",
                "linear-gradient(90deg,#ffa657,#c86000)",
            ];

            // TAG → card-tag mapping
            const TAG_MAP = {
                pandas: ["pandas", "toolbox"],
                statistics: ["statistics"],
                preprocessing: ["preprocessing"],
                "machine-learning": ["machine-learning", "supervised"],
                regression: ["regression"],
                visualization: ["visualization"],
                clustering: ["clustering"],
            };

            // ── Build cards from data attributes ──
            function buildCards() {
                const cards = document.querySelectorAll(".card[data-file]");
                cards.forEach((card, i) => {
                    const title = card.dataset.title;
                    const desc = card.dataset.desc;
                    const file = card.dataset.file;
                    const rawSecs = card.dataset.sections.split("|");
                    const tags = card.dataset.tags.split(" ");

                    card.style.animationDelay = i * 0.06 + "s";

                    // accent bar
                    const bar = document.createElement("div");
                    bar.className = "card-accent-bar";
                    bar.style.background = COLORS[i % COLORS.length];
                    card.appendChild(bar);

                    // body
                    const body = document.createElement("div");
                    body.className = "card-body";

                    // label
                    const label = document.createElement("div");
                    label.className = "card-label";
                    label.textContent = file.replace(".html", "");
                    body.appendChild(label);

                    // title
                    const h2 = document.createElement("div");
                    h2.className = "card-title";
                    h2.textContent = title;
                    body.appendChild(h2);

                    // tags
                    const tagRow = document.createElement("div");
                    tagRow.className = "tags";
                    tags.forEach((t) => {
                        const span = document.createElement("span");
                        span.className = "tag";
                        span.textContent = t;
                        tagRow.appendChild(span);
                    });
                    body.appendChild(tagRow);

                    // desc
                    const p = document.createElement("p");
                    p.className = "card-desc";
                    p.textContent = desc;
                    body.appendChild(p);

                    // sections
                    const ul = document.createElement("ul");
                    ul.className = "sections";
                    rawSecs.forEach((sec) => {
                        const li = document.createElement("li");
                        li.dataset.text = sec.toLowerCase();
                        li.textContent = sec;
                        ul.appendChild(li);
                    });
                    body.appendChild(ul);

                    card.appendChild(body);

                    // footer
                    const foot = document.createElement("div");
                    foot.className = "card-footer";

                    const count = document.createElement("span");
                    count.className = "section-count";
                    count.textContent = rawSecs.length + " sections";
                    foot.appendChild(count);

                    const link = document.createElement("a");
                    link.className = "open-btn";
                    link.href = file;
                    link.target = "_blank";
                    link.rel = "noopener";
                    link.innerHTML = `Open
        <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
          <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
          <polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/>
        </svg>`;
                    foot.appendChild(link);

                    card.appendChild(foot);
                });
            }

            // ── Search + filter logic ──
            let activeTag = "all";
            let searchQuery = "";

            function escape(str) {
                return str.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
            }

            function highlight(text, query) {
                if (!query) return text;
                const re = new RegExp("(" + escape(query) + ")", "gi");
                return text.replace(re, "<mark>$1</mark>");
            }

            function applyFilters() {
                const q = searchQuery.trim().toLowerCase();
                const cards = document.querySelectorAll(".card[data-file]");
                let visible = 0;

                cards.forEach((card) => {
                    const cardTags = card.dataset.tags.toLowerCase();
                    const cardTitle = card.dataset.title.toLowerCase();
                    const cardDesc = card.dataset.desc.toLowerCase();
                    const sections = Array.from(
                        card.querySelectorAll(".sections li"),
                    );
                    const allText =
                        cardTitle +
                        " " +
                        cardDesc +
                        " " +
                        cardTags +
                        " " +
                        sections.map((s) => s.dataset.text).join(" ");

                    // tag filter
                    let tagMatch = true;
                    if (activeTag !== "all") {
                        const pillTags = TAG_MAP[activeTag] || [activeTag];
                        tagMatch = pillTags.some((pt) => cardTags.includes(pt));
                    }

                    // search filter
                    const searchMatch = !q || allText.includes(q);

                    const show = tagMatch && searchMatch;
                    card.dataset.hidden = show ? "false" : "true";
                    if (show) visible++;

                    // highlight title
                    const titleEl = card.querySelector(".card-title");
                    if (titleEl)
                        titleEl.innerHTML = highlight(card.dataset.title, q);

                    // highlight desc
                    const descEl = card.querySelector(".card-desc");
                    if (descEl)
                        descEl.innerHTML = highlight(card.dataset.desc, q);

                    // highlight sections
                    sections.forEach((li) => {
                        const raw = li.dataset.text;
                        const isMatch = q && raw.includes(q);
                        li.classList.toggle("search-match", isMatch);
                        li.innerHTML = highlight(
                            li.dataset.text.split("|")[0] || raw,
                            q,
                        );
                        // restore original casing
                        if (!q) li.textContent = li.dataset.text;
                        else
                            li.innerHTML = highlight(
                                card.dataset.sections
                                    .split("|")
                                    .find((s) => s.toLowerCase() === raw) ||
                                    raw,
                                q,
                            );
                    });
                });

                document.getElementById("no-results").style.display =
                    visible === 0 ? "block" : "none";

                const countEl = document.getElementById("match-count");
                if (q) {
                    countEl.textContent =
                        visible + " of " + cards.length + " match";
                } else {
                    countEl.textContent = "";
                }
            }

            // ── Pills ──
            document
                .getElementById("filters")
                .addEventListener("click", (e) => {
                    const pill = e.target.closest(".pill");
                    if (!pill) return;
                    document
                        .querySelectorAll(".pill")
                        .forEach((p) => p.classList.remove("active"));
                    pill.classList.add("active");
                    activeTag = pill.dataset.tag;
                    applyFilters();
                });

            // ── Search input ──
            document.getElementById("search").addEventListener("input", (e) => {
                searchQuery = e.target.value;
                applyFilters();
            });

            // ── Init ──
            buildCards();
            applyFilters();
        </script>
    </body>
</html>
